    }
    .logo-sep {
      width: 1px; height: 16px;
      background: rgba(255,255,255,0.25);
      margin: 0 0.45rem;
    }
    .logo-rd {

      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 3px;
      background: transparent; color: #fff;
      font-size: 0.75rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;

    .btn-acceso:hover { background: #fff; color: #000; }

      padding: 0.85rem 1rem;
      border-bottom: 1px solid #0a0a0a;
    }
    .nav-close {
      background: none; border: none; color: #fff;
      font-size: 1.5rem; cursor: pointer; line-height: 1;
    }
    .nav-links { flex: 1; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.95rem 1.2rem;
      font-size: 1rem; color: #fff;
      border-bottom: 1px solid #080808;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
    }
    .nav-item:hover { background: #0a0a0a; }
    .nav-item.current { color: var(--text-dim); }
    .nav-chevron { color: #444; }
    .nav-search {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.95rem 1.2rem;
      color: #666; font-size: 0.9rem;
      border-bottom: 1px solid #080808;
      cursor: pointer;
    }
    .nav-lang-section {
      padding: 1.2rem 1.2rem 2.5rem;
      border-top: 1px solid #0d0d0d;
    }
    .nav-lang-label { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.55rem; }
    .lang-toggle { display: flex; }
    .lang-btn {
      padding: 0.28rem 0.8rem;
      background: #1a1a1a; color: #aaa;
      border: none; cursor: pointer;
      font-size: 0.7rem; font-family: 'DM Mono', monospace;
    }
    .lang-btn.active { background: #fff; color: #000; font-weight: 500; }

    /* ── FILTER PANEL ── */

      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease;
      background: #060606;
    }

    .filter-inner { padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }

      padding: 0.28rem 0.75rem;
      border: 1px solid #252525; border-radius: 20px;
      font-size: 0.68rem; color: #777;
      cursor: pointer; background: none;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;
    }
    .fchip:hover, .fchip.on {
      border-color: var(--gold); color: var(--gold);
      background: rgba(184,134,11,0.07);
    }

      padding: 0; white-space: nowrap;
      margin-top: 0.5rem; flex-shrink: 0;

      font-size: 0.78rem; border-radius: 2px; cursor: pointer;

      cursor: pointer; transition: filter 0.2s;
    }

      position: relative; height: 195px; overflow: hidden;
    }
    .cimg-bg {
      width: 100%; height: 100%; position: relative;
    }
    /* Landscape silhouette at bottom */
    .cimg-land {
      position: absolute; bottom: 0; left: 0; right: 0; height: 55%;
    }
    /* Atmosphere glow */
    .cimg-glow {
      position: absolute; inset: 0;
    }

      display: flex; align-items: stretch;

</head>

    glow:'radial-gradient(ellipse 70% 50% at 50% 24%, rgba(232,200,64,0.16) 0%, transparent 70%)'
  },
];

const MODULOS = {
  bronce:   '🥉 Módulo Bronce — Fundamentos del Vino',
  plata:    '🥈 Módulo Plata — Nivel Intermedio',
  oro:      '🥇 Módulo Oro — Nivel Avanzado',
  diplomado:'🎓 Diplomado Sommelier Profesional',
};

let activeFilter = 'todos';

function stars(n) {
  let s = '';
  for (let i = 1; i <= 5; i++)
    s += `<span class="s ${i <= n ? 'on' : 'off'}">★</span>`;
  return `<div class="cstars">${s}</div>`;
}

function render() {
  const wrap = document.getElementById('coursesWrap');
  const noR  = document.getElementById('no-results');
  const max  = parseInt(document.getElementById('showSelect').value);

  const list = activeFilter === 'todos'
    ? COURSES
    : COURSES.filter(c => c.nivel === activeFilter);
  const shown = list.slice(0, max);

  if (!shown.length) {
    wrap.innerHTML = '';
    noR.style.display = 'block';
    return;
  }
  noR.style.display = 'none';

  let html = '';
  let lastNivel = null;

  shown.forEach(c => {
    if (c.nivel !== lastNivel) {
      html += `<div class="modulo-div">${MODULOS[c.nivel] || c.nivel}</div>`;
      lastNivel = c.nivel;
    }
    html += `
    <div class="course-card" onclick="goApp()">
      <div class="cimg">
        <div class="cimg-bg" style="background:${c.bg}">
          <div class="cimg-glow" style="background:${c.glow}"></div>
          <div class="cimg-land" style="background:${c.landC};clip-path:${c.land}"></div>
        </div>
        <div class="cbrand">
          <div class="cbrand-logo">S</div>
          <div class="cbrand-name">${c.brand}</div>
        </div>
      </div>
      <div class="cinfo">
        <div class="clevel">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" opacity="0.55">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
          </svg>
          ${c.lbl}
        </div>
        <div class="ctitle">${c.titulo}</div>
        ${stars(c.stars)}
      </div>
    </div>`;
  });

  wrap.innerHTML = html;
}

function setFilter(btn, nivel) {
  document.querySelectorAll('.fchip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  activeFilter = nivel;
  render();
}

function toggleFilter() {
  document.getElementById('filterPanel').classList.toggle('open');
}

function openNav()  { document.getElementById('navOverlay').classList.add('open'); }
function closeNav() { document.getElementById('navOverlay').classList.remove('open'); }
function goApp()    { window.location.href = 'index.html'; }

render();
</script>
</body>
</html>
